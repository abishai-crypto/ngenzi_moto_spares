<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="300" cy="260" r="140" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="10 8"/>

  <!-- Motorcycle / Bajaj Sprocket & Brake Disc Emblem -->
  <g transform="translate(300, 260)">
    <!-- Gear Teeth -->
    <path d="M-18,-110 L18,-110 L14,-85 L-14,-85 Z" fill="#94a3b8" />
    <path d="M-18,-110 L18,-110 L14,-85 L-14,-85 Z" fill="#94a3b8" transform="rotate(30)" />
    <path d="M-18,-110 L18,-110 L14,-85 L-14,-85 Z" fill="#94a3b8" transform="rotate(60)" />
    <path d="M-18,-110 L18,-110 L14,-85 L-14,-85 Z" fill="#94a3b8" transform="rotate(90)" />
    <path d="M-18,-110 L18,-110 L14,-85 L-14,-85 Z" fill="#94a3b8" transform="rotate(120)" />
    <path d="M-18,-110 L18,-110 L14,-85 L-14,-85 Z" fill="#94a3b8" transform="rotate(150)" />
    <path d="M-18,-110 L18,-110 L14,-85 L-14,-85 Z" fill="#94a3b8" transform="rotate(180)" />
    <path d="M-18,-110 L18,-110 L14,-85 L-14,-85 Z" fill="#94a3b8" transform="rotate(210)" />
    <path d="M-18,-110 L18,-110 L14,-85 L-14,-85 Z" fill="#94a3b8" transform="rotate(240)" />
    <path d="M-18,-110 L18,-110 L14,-85 L-14,-85 Z" fill="#94a3b8" transform="rotate(270)" />
    <path d="M-18,-110 L18,-110 L14,-85 L-14,-85 Z" fill="#94a3b8" transform="rotate(300)" />
    <path d="M-18,-110 L18,-110 L14,-85 L-14,-85 Z" fill="#94a3b8" transform="rotate(330)" />

    <!-- Disc Body -->
    <circle cx="0" cy="0" r="90" fill="url(#emblemGrad)"/>
    <circle cx="0" cy="0" r="55" fill="#f8fafc"/>
    <circle cx="0" cy="0" r="28" fill="url(#emblemGrad)"/>

    <!-- Disc Vent Holes -->
    <circle cx="0" cy="-70" r="6" fill="#ffffff"/>
    <circle cx="70" cy="0" r="6" fill="#ffffff"/>
    <circle cx="0" cy="70" r="6" fill="#ffffff"/>
    <circle cx="-70" cy="0" r="6" fill="#ffffff"/>
    <circle cx="49" cy="-49" r="6" fill="#ffffff"/>
    <circle cx="49" cy="49" r="6" fill="#ffffff"/>
    <circle cx="-49" cy="49" r="6" fill="#ffffff"/>
    <circle cx="-49" cy="-49" r="6" fill="#ffffff"/>
  </g>

  <!-- Labels -->
  <text x="300" y="450" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="1">NGENZI MOTO SPARE PARTS</text>
  <text x="300" y="482" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b">IMAGE NOT AVAILABLE</text>
  <text x="300" y="510" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Picha Halisi Inasasishwa Hivi Karibuni</text>
</svg>